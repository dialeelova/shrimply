# Builds the Windows installer in the cloud.
# Publish a version (a tag like v1.0.0) and Shrimply-Setup.exe appears on the Releases page.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # lets you also start a test build by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the app's tools
        run: npm install

      - name: Install the installer builder
        run: npm install --no-save electron-builder@26

      - name: Build the installer
        run: npx electron-builder --win --publish never

      - name: Keep the installer as a download of this run
        uses: actions/upload-artifact@v4
        with:
          name: Shrimply-Setup
          path: dist/Shrimply-Setup.exe

      - name: Publish it on the Releases page
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Shrimply-Setup.exe
          generate_release_notes: true
