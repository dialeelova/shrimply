<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shrimply</title>
  <style>
    @font-face { font-family: 'Pixelify Sans'; font-weight: 500; src: url('assets/fonts/pixelify-sans-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Pixelify Sans'; font-weight: 700; src: url('assets/fonts/pixelify-sans-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Press Start 2P'; font-weight: 400; src: url('assets/fonts/press-start-2p-latin-400-normal.woff2') format('woff2'); }
    :root {
      --edge: #8B84D7;      /* periwinkle outline */
      --frame: #C8C8EF;     /* lavender frame */
      --ink: #4A47A8;       /* text */
      --bubble: #D0F0FF;
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: 'Pixelify Sans', 'Courier New', monospace; font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'clig' 0, 'calt' 0; }

    .shadow {
      height: calc(100% - 20px);
      margin: 10px;
      filter: drop-shadow(4px 4px 0 rgba(74, 71, 168, 0.28));
    }
    .win  { box-sizing: border-box; height: 100%; padding: 4px; background: linear-gradient(135deg, #EFA6D2 0%, #8B84D7 24%, #8B84D7 76%, #EFA6D2 100%); }
    .face { height: 100%; display: flex; flex-direction: column;
      background: radial-gradient(circle at 0% 0%, rgba(255,205,230,0.85), rgba(255,205,230,0) 34%),
                  radial-gradient(circle at 100% 100%, rgba(255,205,230,0.85), rgba(255,205,230,0) 34%),
                  var(--frame); }

    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px 6px 12px;
      color: var(--ink); font-size: 24px; font-weight: 700;
      -webkit-app-region: drag; user-select: none;
    }
    .title { display: flex; align-items: center; gap: 8px; }
    .title img { width: 21px; height: 21px; image-rendering: pixelated; }
    .buttons { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    .btn {
      width: 28px; height: 28px; padding: 0; border-radius: 50%;
      border: 3px solid var(--edge); background: var(--bubble); color: var(--ink);
      font: inherit; font-size: 16px; line-height: 1; cursor: pointer;
    }
    .btn:hover { background: #FFD9F2; }

    .sea-border { flex: 1; margin: 0 8px 8px; padding: 3px; background: var(--edge); }
    .sea {
      position: relative; height: 100%; overflow: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(255,190,222,0.55), rgba(255,190,222,0) 42%),
        radial-gradient(circle at 100% 0%, rgba(255,190,222,0.55), rgba(255,190,222,0) 42%),
        radial-gradient(circle at 0% 100%, rgba(255,190,222,0.35), rgba(255,190,222,0) 36%),
        radial-gradient(circle at 100% 100%, rgba(255,190,222,0.35), rgba(255,190,222,0) 36%),
        linear-gradient(#FFD9F2 0%, #D0F0FF 26%, #B3E9EE 48%, #A2E4E2 66%, #84A0D8 100%);
    }
    .rays {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(105deg, rgba(255,255,255,0) 0 26px, rgba(255,255,255,0.28) 26px 44px);
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent 70%);
      animation: sway 7s ease-in-out infinite;
    }
    @keyframes sway { 0%,100% { opacity: .35; transform: translateX(-10px); } 50% { opacity: .75; transform: translateX(10px); } }

    .seabed {
      position: absolute; left: 0; right: 0; bottom: 0; height: 96px;
      background: url('assets/seabed.png') no-repeat bottom / 100% auto;
      image-rendering: pixelated;
    }
    #bubbles { position: absolute; inset: 0; }
    .bub {
      position: absolute; bottom: -50px; image-rendering: pixelated;
      animation: rise var(--t) linear forwards;
    }
    .bub.peach { filter: hue-rotate(105deg) saturate(1.2); }
    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(var(--dx), -190px); }
      90%  { opacity: 1; }
      100% { transform: translate(calc(var(--dx) * -1), -420px); opacity: 0; }
    }

    #shrimp {
      position: absolute; left: 50%; top: 52%;
      width: 150px; margin-left: -75px; margin-top: -75px;
      image-rendering: pixelated; transform-origin: 50% 90%;
      animation: bob 2.6s ease-in-out infinite;
      cursor: pointer; user-select: none; -webkit-user-drag: none;
    }
    @keyframes bob {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50%     { transform: translateY(-10px) rotate(2deg); }
    }

    .msg-border { position: absolute; left: 12px; right: 12px; top: 12px; padding: 3px; background: #F2A98A; }
    .msg { padding: 8px 10px; background: #FFE8CC; color: #C9531A; text-align: center; font-size: 18px; }
    .btn.size { display: flex; align-items: center; justify-content: center; }
    .btn.size::before { content: ''; width: 9px; height: 9px; border: 2px solid var(--ink); }
    .btn.off { opacity: 0.45; text-decoration: line-through; }
    .act-border { flex: 1; margin-right: 8px; padding: 3px; background: var(--edge); display: none; white-space: nowrap; }
    .act-border .act { width: 100%; }
    .act {
      display: block; border: none; cursor: pointer; padding: 4px 10px;
      background: #FFD9F2; color: var(--ink); font: inherit; font-size: 14px;
    }
    .act:hover { background: #FFC8E1; }
    .btn.gear { display: flex; align-items: center; justify-content: center; }
    .btn.gear::before { content: ''; width: 12px; height: 2px; background: var(--ink);
      box-shadow: 0 -5px 0 var(--ink), 0 5px 0 var(--ink); }
    .panel-border { position: absolute; left: 12px; right: 12px; top: 12px; bottom: 12px; z-index: 5;
      padding: 3px; box-sizing: border-box; background: var(--edge); display: none; }
    .panel { height: 100%; box-sizing: border-box; padding: 10px 12px; background: #FBF6FF; color: var(--ink);
      display: flex; flex-direction: column; gap: 9px; font-size: 16px; }
    .p-title { text-align: center; font-size: 22px; font-weight: 700; }
    .chips { display: flex; gap: 6px; margin-top: 4px; }
    .chip { flex: 1; padding: 4px 0; border: 3px solid var(--edge); background: #fff; color: var(--ink);
      font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 11px; cursor: pointer; }
    .chip:hover { background: #FFE8F3; }
    .chip.on { background: #FFC8E1; }
    .p-note { font-size: 13px; text-align: center; opacity: 0.8; }
    .done { margin-top: auto; align-self: center; padding: 5px 18px; border: 3px solid var(--edge);
      background: #FFD9F2; color: var(--ink); font: inherit; font-size: 16px; cursor: pointer; }
    .done:hover { background: #FFC8E1; }
    #drops { position: absolute; inset: 0; overflow: hidden; pointer-events: none; display: none; }
    .rain { position: absolute; top: -70px; image-rendering: pixelated;
      animation: fall var(--d) linear var(--delay) infinite; }
    @keyframes fall {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateY(var(--h)); opacity: 0; }
    }
    .msg-border.water { background: #7DB9EA; }
    .msg-border.water .msg { background: #E6F5FF; color: #2A6BB0; }
    .fx { position: absolute; z-index: 3; pointer-events: none; filter: drop-shadow(0 0 3px rgba(255,255,255,0.95)); animation: twinkle 1.1s ease-out forwards; }
    @keyframes twinkle {
      0%   { transform: scale(0) rotate(0deg); opacity: 0; }
      30%  { transform: scale(1) rotate(20deg); opacity: 1; }
      100% { transform: scale(0.3) rotate(70deg) translateY(-14px); opacity: 0; }
    }
    .heart-corner { flex: none; margin-left: auto; width: 42px; padding: 0; border: none; background: none; cursor: pointer; }
    .heart-corner img { width: 100%; display: block; transition: transform 0.15s; }
    .heart-corner:hover img { transform: scale(1.12); }
    .big-heart { width: 70px; align-self: center; }
    .stat { display: flex; justify-content: space-between; align-items: center; padding-bottom: 5px; border-bottom: 2px dotted #C8C8EF; }
    .stat b { font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 12px; font-weight: 400; }
    .bottom-row { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; z-index: 4; pointer-events: none; }
    .bottom-row > * { pointer-events: auto; }
  </style>
</head>
<body>
  <div class="shadow">
    <div class="win" data-px data-s="4" data-n="3">
      <div class="face" data-px data-s="4" data-n="2">
        <div class="titlebar">
          <span class="title"><img src="assets/bubble-s.png" alt="">Shrimply</span>
          <div class="buttons">
            <button class="btn gear" id="gear" title="Settings"></button>
            <button class="btn size" id="size" title="Window size"></button>
            <button class="btn" id="min" title="Minimize">-</button>
            <button class="btn" id="close" title="Hide to tray">x</button>
          </div>
        </div>
        <div class="sea-border" data-px data-s="3" data-n="1">
          <div class="sea" data-px data-s="3" data-n="1">
            <div class="rays"></div>
            <div id="bubbles"></div>
            <div class="seabed"></div>
            <div id="drops"></div>
            <img id="shrimp" src="assets/straight.png" alt="Shrimply">
            <div class="bottom-row">
              <div class="act-border" id="actWrap" data-px data-s="3" data-n="1">
              <button class="act" id="act">I am sitting straight</button>
            </div>
              <button class="heart-corner" id="statsBtn" title="Today"><img id="statsHeart" src="assets/hearts/heart-0.png" alt=""></button>
            </div>
            <div class="panel-border" id="panel" data-px data-s="3" data-n="1">
              <div class="panel" data-px data-s="3" data-n="1">
                <div class="p-title">Settings</div>
                <div id="rows"></div>
                <div class="p-note" id="note"></div>
                <button class="done" id="done">Done</button>
              </div>
            </div>
            <div class="panel-border" id="stats" data-px data-s="3" data-n="1">
              <div class="panel" data-px data-s="3" data-n="1">
                <div class="p-title">Today</div>
                <img id="bigHeart" class="big-heart" src="assets/hearts/heart-0.png" alt="">
                <div class="stat"><span>Posture fixed</span><b id="sFixed">0</b></div>
                <div class="stat"><span>Caught early</span><b id="sEarly">0</b></div>
                <div class="stat"><span>Water reminders</span><b id="sWater">0</b></div>
                <div class="p-note" id="sNote"></div>
                <button class="done" id="statsDone">Done</button>
              </div>
            </div>
            <div class="msg-border" data-px data-s="3" data-n="1">
              <div class="msg" id="msg" data-px data-s="3" data-n="1">Shrimply do your best!</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer, webFrame } = require('electron');
    document.getElementById('close').onclick = () => {      // hide to the tray (the app keeps running)
      let first = false;
      try { first = !localStorage.getItem('trayHint'); localStorage.setItem('trayHint', '1'); } catch (e) {}
      ipcRenderer.send('hide', first);
    };
    document.getElementById('min').onclick = () => ipcRenderer.send('minimize');

    // stepped pixel corners: staircase of n steps, each s px
    function poly(s, n) {
      const tl = [];
      for (let i = 0; i < n; i++) tl.push([i * s, (n - i) * s], [(i + 1) * s, (n - i) * s]);
      tl.push([n * s, 0]);
      const X = (v, m) => m ? `calc(100% - ${v}px)` : `${v}px`;
      const pts = [
        ...tl.map(([x, y]) => X(x, 0) + ' ' + X(y, 0)),
        ...tl.slice().reverse().map(([x, y]) => X(x, 1) + ' ' + X(y, 0)),
        ...tl.map(([x, y]) => X(x, 1) + ' ' + X(y, 1)),
        ...tl.slice().reverse().map(([x, y]) => X(x, 0) + ' ' + X(y, 1))
      ];
      return `polygon(${pts.join(',')})`;
    }
    document.querySelectorAll('[data-px]').forEach(el => {
      el.style.clipPath = poly(+el.dataset.s, +el.dataset.n);
    });

    // rising bubbles
    const layer = document.getElementById('bubbles');
    const sizes = ['bubble-s.png', 'bubble-m.png', 'bubble-l.png'];
    function spawn() {
      if (layer.children.length > 14) return;
      const b = document.createElement('img');
      b.className = 'bub';
      b.src = 'assets/' + sizes[Math.floor(Math.random() * sizes.length)];
      if (Math.random() < 0.35) b.classList.add('peach');
      b.style.left = Math.random() * 90 + 3 + '%';
      b.style.setProperty('--t', (6 + Math.random() * 5) + 's');
      b.style.setProperty('--dx', (Math.random() * 24 - 12) + 'px');
      b.addEventListener('animationend', () => b.remove());
      layer.appendChild(b);
    }
    spawn(); setInterval(spawn, 1100);

    // ---------- Reminder Mode ----------
    const demo = new URLSearchParams(location.search).get('test') === '1';
    // ---------- settings (saved in the app, so they are remembered) ----------
    const DEFAULTS = { remind: 20, sound: true };
    let cfg = Object.assign({}, DEFAULTS);
    try { Object.assign(cfg, JSON.parse(localStorage.getItem('settings') || '{}')); } catch (e) {}
    function saveCfg() { try { localStorage.setItem('settings', JSON.stringify(cfg)); } catch (e) {} }
    const warnMs = () => (demo ? 10 : cfg.remind * 60) * 1000;   // time until the first reminder
    const badMs  = () => (demo ? 8 : 2 * 60) * 1000;             // then 2 minutes until fully curled

    const WARN_LINES = ['Psst... is your back bending?', 'Check your back, little shrimp!', 'Shoulders back, please!'];
    const BAD_LINES  = ["Don't be a shrimp! Sit up straight!", 'You are turning into a shrimp!', 'Straighten up, shrimp!'];
    const HAPPY_LINES = ['Much better! Keep it up!', 'Proud of you!', 'Back to work, champion!'];
    const IDLE_LINE = 'Shrimply do your best!';
    const PICS = { good: 'straight', warn: 'slight', bad: 'curled', happy: 'happy', water: 'straight' };
    const WIDTHS = { good: 150, warn: 168, bad: 158, happy: 150, water: 150 };   // so every pose looks the same size

    const shrimp = document.getElementById('shrimp');
    const msg = document.getElementById('msg');
    const actWrap = document.getElementById('actWrap');
    const act = document.getElementById('act');
    const dropsEl = document.getElementById('drops');
    const msgBox = document.querySelector('.msg-border');
    const sea = document.querySelector('.sea');
    const WATER_LINES = ['Drink some water!', 'Time to drink water!', 'Have a sip of water!', 'Stay hydrated! Drink up!'];
    let state = 'good', warnTimer, badTimer, happyTimer, muted = !cfg.sound;

    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    function setState(st, text) {
      state = st;
      shrimp.src = 'assets/' + PICS[st] + '.png';
      shrimp.style.width = WIDTHS[st] + 'px';
      shrimp.style.marginLeft = -WIDTHS[st] / 2 + 'px';
      actWrap.style.display = (st === 'warn' || st === 'bad') ? 'block' : 'none';
      if (st === 'water') startRain(); else stopRain();
      msgBox.classList.toggle('water', st === 'water');
      if (st === 'happy') sparkleBurst();
      if (text) msg.textContent = text;
    }

    // ---------- the two sounds (made in code, no files) ----------
    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function tone(freq, start, dur, type, vol) {
      const t = audio.currentTime + start;
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t); osc.stop(t + dur + 0.05);
    }
    function chime() {            // soft two-note rise: the reminder
      if (muted) return; audio.resume();
      tone(659.25, 0, 0.55, 'sine', 0.12); tone(880, 0.2, 0.8, 'sine', 0.12);
    }
    function happyNote() {        // tiny ta-da: you fixed it
      if (muted) return; audio.resume();
      tone(523.25, 0, 0.14, 'triangle', 0.14); tone(659.25, 0.12, 0.14, 'triangle', 0.14); tone(783.99, 0.24, 0.4, 'triangle', 0.14);
    }

    function waterSound() {       // one water drop: a soft "bloop" that rises and fades, plus a tiny sparkle on top
      if (muted) return; audio.resume();
      const t = audio.currentTime;
      [[1, 0.18, 0.42], [2, 0.05, 0.16]].forEach(([mult, vol, len]) => {
        const osc = audio.createOscillator(), gain = audio.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520 * mult, t);
        osc.frequency.exponentialRampToValueAtTime(1500 * mult, t + 0.12);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol, t + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
        osc.connect(gain).connect(audio.destination);
        osc.start(t); osc.stop(t + len + 0.05);
      });
    }

    // ---------- the cycle ----------
    function schedule() {
      clearTimeout(warnTimer); clearTimeout(badTimer);
      warnTimer = setTimeout(() => {
        setState('warn', pick(WARN_LINES));
        count('reminders');
        closeSettings();
        chime();
        ipcRenderer.send('attention');
        badTimer = setTimeout(() => setState('bad', pick(BAD_LINES)), badMs());
      }, warnMs());
    }
    function fixed() {            // user sat up straight
      if (state === 'warn' || state === 'bad') { count('fixed'); if (state === 'warn') count('early'); }
      clearTimeout(warnTimer); clearTimeout(badTimer); clearTimeout(happyTimer);
      setState('happy', pick(HAPPY_LINES));
      happyNote();
      happyTimer = setTimeout(() => { setState('good', IDLE_LINE); schedule(); maybeWater(); }, 3000);
    }

    act.onclick = fixed;

    // ---------- water reminders (a friendly nudge that fades away by itself) ----------
    let waterTimer, waterShowTimer, waterDue = false;
    const WATER_EVERY_MS = (demo ? 3 : 60 * 60) * 1000;   // once an hour
    const WATER_SHOW_MS  = (demo ? 6 : 10) * 1000;        // stays on screen about 10 seconds
    function scheduleWater() {
      clearTimeout(waterTimer);
      waterTimer = setTimeout(() => { waterDue = true; maybeWater(); }, WATER_EVERY_MS);
    }
    function maybeWater() {       // only when the shrimp is calm: posture reminders go first
      if (!waterDue || state !== 'good') return;
      waterDue = false;
      setState('water', pick(WATER_LINES));
      count('water');
      closeSettings(); waterSound();
      ipcRenderer.send('attention');
      clearTimeout(waterShowTimer);
      waterShowTimer = setTimeout(() => { if (state === 'water') setState('good', IDLE_LINE); }, WATER_SHOW_MS);
      scheduleWater();
    }

    // ---------- little dark-blue drops falling behind the shrimp ----------
    const DROPS = ['assets/fx/drop-1.png', 'assets/fx/drop-2.png'];
    DROPS.forEach(src => { new Image().src = src; });
    function startRain() {
      dropsEl.innerHTML = ''; dropsEl.style.display = 'block';
      const h = sea.clientHeight + 90, n = 10;
      for (let i = 0; i < n; i++) {
        const el = document.createElement('img');
        el.className = 'rain'; el.src = pick(DROPS);
        el.style.width = pick([18, 27]) + 'px';   // whole multiples of the 9px sprite keep it crisp
        el.style.left = ((i + 0.5) / n * 100 + (Math.random() * 6 - 3)) + '%';
        el.style.setProperty('--d', (1.7 + Math.random() * 1.1) + 's');
        el.style.setProperty('--delay', (-Math.random() * 2.5) + 's');   // negative: already falling when it appears
        el.style.setProperty('--h', h + 'px');
        dropsEl.appendChild(el);
      }
    }
    function stopRain() { dropsEl.style.display = 'none'; dropsEl.innerHTML = ''; }

    // ---------- sparkles when the shrimp is happy ----------
    const FX = Array.from({ length: 10 }, (_, i) => 'assets/fx/fx-' + (i + 1) + '.png');
    FX.forEach(src => { new Image().src = src; });
    function sparkleBurst() {
      const cx = sea.clientWidth / 2, cy = sea.clientHeight * 0.52;
      for (let i = 0; i < 12; i++) {
        setTimeout(() => {
          const el = document.createElement('img');
          el.className = 'fx'; el.src = pick(FX);
          const ang = Math.random() * Math.PI * 2, rad = 60 + Math.random() * 60, size = 22 + Math.random() * 18;
          el.style.width = size + 'px';
          el.style.left = (cx + Math.cos(ang) * rad * 1.1 - size / 2) + 'px';
          el.style.top  = (cy + Math.sin(ang) * rad * 0.9 - size / 2) + 'px';
          el.addEventListener('animationend', () => el.remove());
          sea.appendChild(el);
        }, i * 130);
      }
    }
    shrimp.addEventListener('click', () => {
      if (state === 'warn' || state === 'bad') return fixed();
      if (state === 'good') {     // just a little cheer, the timer keeps running
        clearTimeout(happyTimer);
        setState('happy', pick(HAPPY_LINES));
        happyTimer = setTimeout(() => { if (state === 'happy') { setState('good', IDLE_LINE); maybeWater(); } }, 2000);
      }
    });

    // ---------- blinking: the eyes close for a moment, now and then ----------
    const BLINK = { good: 'straight-blink', warn: 'slight-blink', bad: 'curled-blink', water: 'straight-blink' };
    Object.values(BLINK).forEach(n => { new Image().src = 'assets/' + n + '.png'; });   // preload
    function blinkOnce() {
      const st = state;
      if (!BLINK[st]) return;                       // happy already has closed eyes
      shrimp.src = 'assets/' + BLINK[st] + '.png';
      setTimeout(() => { if (state === st) shrimp.src = 'assets/' + PICS[st] + '.png'; }, 160);
    }
    function blinkLoop() {
      setTimeout(() => {
        blinkOnce();
        if (Math.random() < 0.25) setTimeout(blinkOnce, 320);   // sometimes a double blink
        blinkLoop();
      }, 2500 + Math.random() * 3500);
    }
    blinkLoop();

    // ---------- window size: 100% (biggest) down to 70% ----------
    const MIN_SCALE = 0.7, MAX_SCALE = 1;
    let scale = 1;
    function applyScale(v) {
      scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.round(v * 100) / 100));
      webFrame.setZoomFactor(scale);
      ipcRenderer.send('scale', scale);
      try { localStorage.setItem('scale', String(scale)); } catch (e) {}
    }
    document.getElementById('size').onclick = () => applyScale(scale > 0.9 ? 0.85 : scale > 0.75 ? 0.7 : 1);
    window.addEventListener('wheel', e => {       // Ctrl + mouse wheel also works
      if (!e.ctrlKey) return;
      e.preventDefault();
      applyScale(scale + (e.deltaY < 0 ? 0.05 : -0.05));
    }, { passive: false });
    try { applyScale(parseFloat(localStorage.getItem('scale')) || 1); } catch (e) { applyScale(1); }

    // ---------- settings panel ----------
    const ROWS = [
      { key: 'remind', label: 'Minutes between reminders', opts: [15, 20, 30, 45], names: ['15', '20', '30', '45'] },
      { key: 'sound',  label: 'Sound',                        opts: [true, false],   names: ['On', 'Off'] }
    ];
    const panel = document.getElementById('panel');
    const rowsEl = document.getElementById('rows');
    function refreshChips() {
      rowsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', String(cfg[c.dataset.key]) === c.dataset.v));
    }
    function setSound(on) { cfg.sound = on; muted = !on; saveCfg(); refreshChips(); }
    ROWS.forEach(r => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<span>' + r.label + '</span><div class="chips"></div>';
      r.opts.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = r.names[i]; b.dataset.key = r.key; b.dataset.v = String(o);
        b.onclick = () => {
          if (r.key === 'sound') return setSound(o);
          cfg[r.key] = o; saveCfg(); refreshChips();
          if (r.key === 'remind' && state === 'good') schedule();   // restart the countdown with the new time
        };
        row.querySelector('.chips').appendChild(b);
      });
      rowsEl.appendChild(row);
    });
    document.getElementById('note').textContent = demo ? 'Demo mode: reminders use fast test times.' : '';
    function openSettings() { document.getElementById('stats').style.display = 'none'; panel.style.display = 'block'; }
    function closeSettings() { panel.style.display = 'none'; document.getElementById('stats').style.display = 'none'; }
    document.getElementById('gear').onclick = () => (panel.style.display === 'block' ? closeSettings() : openSettings());
    document.getElementById('done').onclick = closeSettings;
    refreshChips();

    // ---------- daily stats (saved on this computer, fresh every day) ----------
    const todayKey = () => new Date().toLocaleDateString('en-CA');          // like 2026-10-21
    const freshStats = () => ({ date: todayKey(), fixed: 0, early: 0, reminders: 0, water: 0 });
    let stats = freshStats();
    try { const saved = JSON.parse(localStorage.getItem('stats') || 'null'); if (saved && saved.date === todayKey()) stats = saved; } catch (e) {}
    const statsPanel = document.getElementById('stats');
    function refreshStats() {
      if (stats.date !== todayKey()) stats = freshStats();
      const lvl = Math.min(4, stats.fixed);                                   // the heart fills up with every fix
      document.getElementById('statsHeart').src = 'assets/hearts/heart-' + lvl + '.png';
      document.getElementById('bigHeart').src = 'assets/hearts/heart-' + lvl + '.png';
      document.getElementById('sFixed').textContent = stats.fixed;
      document.getElementById('sEarly').textContent = stats.early;
      document.getElementById('sWater').textContent = stats.water;
      document.getElementById('sNote').textContent =
        lvl === 0 ? 'Fix your posture to fill the heart!' : lvl < 4 ? 'Nice! Keep going!' : 'Heart full! What a day!';
    }
    function count(key) {
      refreshStats();                                                         // starts a new day if needed
      stats[key]++;
      try { localStorage.setItem('stats', JSON.stringify(stats)); } catch (e) {}
      refreshStats();
    }
    document.getElementById('statsBtn').onclick = () => {
      if (statsPanel.style.display === 'block') { statsPanel.style.display = 'none'; return; }
      panel.style.display = 'none'; refreshStats(); statsPanel.style.display = 'block';
    };
    document.getElementById('statsDone').onclick = () => { statsPanel.style.display = 'none'; };
    refreshStats();

    schedule();
    scheduleWater();
  </script>
</body>
</html>
